# Coturn TURN Server Configuration for Buddy Poker P2P

# Listening ports
listening-port=3478
tls-listening-port=443

# Relay ports range (for media relay)
min-port=49152
max-port=65535

# Server identification
realm=buddy-poker.example.com
server-name=turn.buddy-poker.example.com

# SSL/TLS certificates (required for turns: on port 443)
# In production, use Let's Encrypt certificates
# For development, you can generate self-signed:
# openssl req -x509 -newkey rsa:4096 -keyout key.pem -out cert.pem -days 365 -nodes
cert=/etc/coturn/certs/cert.pem
pkey=/etc/coturn/certs/key.pem

# Authentication method
lt-cred-mech

# User credentials (change in production!)
# Format: username=password
user=buddypoker:change-me-in-production

# Quotas and limits
max-bps=1000000           # Max bandwidth per session (1 Mbps)
bps-capacity=0            # No total capacity limit
total-quota=100           # Max 100 concurrent sessions
user-quota=10             # Max 10 sessions per user

# Security
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1

# Logging
log-file=/var/log/turnserver.log
verbose

# External IP (uncomment and set in production)
# Replace with your server's public IP
# external-ip=YOUR_PUBLIC_IP

# Allow loopback peers (useful for testing)
# Comment out in production
allow-loopback-peers

# Deny peers on private networks (uncomment in production for security)
# denied-peer-ip=0.0.0.0-0.255.255.255
# denied-peer-ip=10.0.0.0-10.255.255.255
# denied-peer-ip=172.16.0.0-172.31.255.255
# denied-peer-ip=192.168.0.0-192.168.255.255

# Fingerprint in TURN messages
fingerprint

# Long-term credential mechanism
# Mobility with ICE (MICE) support
mobility

# Server-side stale nonce management
stale-nonce=600

# Process management
pidfile="/var/run/turnserver.pid"
